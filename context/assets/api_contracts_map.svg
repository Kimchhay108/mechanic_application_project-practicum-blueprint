<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 940" width="1450" height="940" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="headerGradApi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>

    <style>
      .badge-get { fill: #ECFDF5; stroke: #059669; stroke-width: 1; }
      .badge-get-txt { font-size: 11px; font-weight: 700; fill: #065F46; font-family: 'Consolas', monospace; }
      .badge-post { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1; }
      .badge-post-txt { font-size: 11px; font-weight: 700; fill: #1E40AF; font-family: 'Consolas', monospace; }
      .badge-patch { fill: #FFFBEB; stroke: #D97706; stroke-width: 1; }
      .badge-patch-txt { font-size: 11px; font-weight: 700; fill: #92400E; font-family: 'Consolas', monospace; }
      .badge-auth-yes { fill: #FEF2F2; stroke: #DC2626; stroke-width: 1; }
      .badge-auth-yes-txt { font-size: 10px; font-weight: 600; fill: #991B1B; }
      .badge-auth-no { fill: #F1F5F9; stroke: #64748B; stroke-width: 1; }
      .badge-auth-no-txt { font-size: 10px; font-weight: 600; fill: #475569; }
      .endpoint-title { font-size: 13px; font-weight: 700; fill: #0F172A; font-family: 'Consolas', monospace; }
      .desc-text { font-size: 11px; fill: #475569; }
      .detail-label { font-size: 10.5px; font-weight: 700; fill: #334155; }
      .detail-code { font-size: 10.5px; fill: #0284C7; font-family: 'Consolas', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1450" height="940" fill="#F8FAFC" />

  <!-- Title & Conventions Bar -->
  <g transform="translate(40, 30)">
    <rect width="1370" height="90" rx="10" fill="url(#headerGradApi)" />
    <text x="24" y="36" font-size="20" font-weight="700" fill="#FFFFFF">MotoCare Cambodia — REST API Contracts Map</text>
    <text x="24" y="58" font-size="12" fill="#94A3B8">Phase 3.4 Specification | Port 8000 | Base URL: http://localhost:8000/api/v1 | Standard Bearer JWT Auth</text>
    <text x="24" y="74" font-size="11" fill="#38BDF8">Standard Error Format: &#123;"error": &#123;"code": "ERROR_CODE", "message": "Human readable text", "details": []&#125;&#125;</text>

    <!-- Standard Status Badges -->
    <g transform="translate(930, 25)">
      <rect x="0" y="0" width="415" height="42" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="12" y="18" font-size="10" font-weight="700" fill="#94A3B8">STATUS CODES</text>
      <text x="12" y="32" font-size="10" fill="#CBD5E1">200 OK  ·  201 Created  ·  400 Validation  ·  401 Auth  ·  403 Forbidden  ·  404 Not Found</text>
    </g>
  </g>

  <g transform="translate(40, 140)" filter="url(#cardShadow)">
    <rect width="670" height="160" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    
    <!-- Top Row -->
    <rect x="14" y="14" width="48" height="22" rx="4" class="badge-get" />
    <text x="38" y="29" text-anchor="middle" class="badge-get-txt">GET</text>

    <text x="70" y="29" class="endpoint-title">EP-01 — /api/v1/health</text>

    <rect x="575" y="14" width="82" height="20" rx="4" class="badge-auth-no" />
    <text x="616" y="28" text-anchor="middle" class="badge-auth-no-txt">🌐 Public</text>

    <line x1="14" y1="44" x2="656" y2="44" stroke="#F1F5F9" stroke-width="1" />

    <!-- Description -->
    <text x="16" y="62" class="desc-text">System health check probe returning service uptime and ISO-8601 timestamp.</text>

    <!-- Request / Response Box -->
    <rect x="14" y="74" width="642" height="72" rx="6" fill="#F8FAFC" stroke="#F1F5F9" />
    <text x="24" y="92" class="detail-label">Payload:</text>
    <text x="80" y="92" class="detail-code">None (Empty body)</text>

    <text x="24" y="112" class="detail-label">Response:</text>
    <text x="80" y="112" class="detail-code">200 OK -> {"status": "ok", "timestamp": "2026-10-17T..."}</text>

    <text x="24" y="132" class="detail-label">Assertion:</text>
    <text x="80" y="132" font-size="10" fill="#059669">status == 200 && response.status == 'ok'</text>
  </g>

  <g transform="translate(40, 315)" filter="url(#cardShadow)">
    <rect width="670" height="160" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    
    <!-- Top Row -->
    <rect x="14" y="14" width="48" height="22" rx="4" class="badge-post" />
    <text x="38" y="29" text-anchor="middle" class="badge-post-txt">POST</text>

    <text x="70" y="29" class="endpoint-title">EP-02 — /api/v1/vehicles</text>

    <rect x="575" y="14" width="82" height="20" rx="4" class="badge-auth-yes" />
    <text x="616" y="28" text-anchor="middle" class="badge-auth-yes-txt">🔒 JWT Bearer</text>

    <line x1="14" y1="44" x2="656" y2="44" stroke="#F1F5F9" stroke-width="1" />

    <!-- Description -->
    <text x="16" y="62" class="desc-text">Registers user vehicle profile and auto-binds model-component maintenance rules.</text>

    <!-- Request / Response Box -->
    <rect x="14" y="74" width="642" height="72" rx="6" fill="#F8FAFC" stroke="#F1F5F9" />
    <text x="24" y="92" class="detail-label">Payload:</text>
    <text x="80" y="92" class="detail-code">{"vehicle_model_id": UUID, "license_plate": "1JJ-8888", "current_odometer": 12450}</text>

    <text x="24" y="112" class="detail-label">Response:</text>
    <text x="80" y="112" class="detail-code">201 Created -> data: {"id": UUID, "bound_reminders_count": 3}</text>

    <text x="24" y="132" class="detail-label">Assertion:</text>
    <text x="80" y="132" font-size="10" fill="#059669">status == 201 && data.id != null && bound_reminders_count >= 1</text>
  </g>

  <g transform="translate(40, 490)" filter="url(#cardShadow)">
    <rect width="670" height="160" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    
    <!-- Top Row -->
    <rect x="14" y="14" width="48" height="22" rx="4" class="badge-get" />
    <text x="38" y="29" text-anchor="middle" class="badge-get-txt">GET</text>

    <text x="70" y="29" class="endpoint-title">EP-03 — /api/v1/vehicles</text>

    <rect x="575" y="14" width="82" height="20" rx="4" class="badge-auth-yes" />
    <text x="616" y="28" text-anchor="middle" class="badge-auth-yes-txt">🔒 JWT Bearer</text>

    <line x1="14" y1="44" x2="656" y2="44" stroke="#F1F5F9" stroke-width="1" />

    <!-- Description -->
    <text x="16" y="62" class="desc-text">Lists all registered vehicles for the authenticated user with real-time health summary.</text>

    <!-- Request / Response Box -->
    <rect x="14" y="74" width="642" height="72" rx="6" fill="#F8FAFC" stroke="#F1F5F9" />
    <text x="24" y="92" class="detail-label">Payload:</text>
    <text x="80" y="92" class="detail-code">None (Filtered by JWT userId)</text>

    <text x="24" y="112" class="detail-label">Response:</text>
    <text x="80" y="112" class="detail-code">200 OK -> data: [ { model, license_plate, health_summary: { status } } ]</text>

    <text x="24" y="132" class="detail-label">Assertion:</text>
    <text x="80" y="132" font-size="10" fill="#059669">status == 200 && Array.isArray(data) && data[0].health_summary.status exists</text>
  </g>

  <g transform="translate(40, 665)" filter="url(#cardShadow)">
    <rect width="670" height="160" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    
    <!-- Top Row -->
    <rect x="14" y="14" width="48" height="22" rx="4" class="badge-patch" />
    <text x="38" y="29" text-anchor="middle" class="badge-patch-txt">PATCH</text>

    <text x="70" y="29" class="endpoint-title">EP-04 — /api/v1/vehicles/:id/odometer</text>

    <rect x="575" y="14" width="82" height="20" rx="4" class="badge-auth-yes" />
    <text x="616" y="28" text-anchor="middle" class="badge-auth-yes-txt">🔒 JWT Bearer</text>

    <line x1="14" y1="44" x2="656" y2="44" stroke="#F1F5F9" stroke-width="1" />

    <!-- Description -->
    <text x="16" y="62" class="desc-text">Updates current odometer mileage and dynamically re-evaluates all reminder rules.</text>

    <!-- Request / Response Box -->
    <rect x="14" y="74" width="642" height="72" rx="6" fill="#F8FAFC" stroke="#F1F5F9" />
    <text x="24" y="92" class="detail-label">Payload:</text>
    <text x="80" y="92" class="detail-code">{"odometer_km": 13500, "source": "manual"}</text>

    <text x="24" y="112" class="detail-label">Response:</text>
    <text x="80" y="112" class="detail-code">200 OK -> data: { vehicle_id, current_odometer: 13500, updated_reminders: [...] }</text>

    <text x="24" y="132" class="detail-label">Assertion:</text>
    <text x="80" y="132" font-size="10" fill="#059669">status == 200 && data.current_odometer == 13500</text>
  </g>

  <g transform="translate(740, 140)" filter="url(#cardShadow)">
    <rect width="670" height="160" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    
    <!-- Top Row -->
    <rect x="14" y="14" width="48" height="22" rx="4" class="badge-get" />
    <text x="38" y="29" text-anchor="middle" class="badge-get-txt">GET</text>

    <text x="70" y="29" class="endpoint-title">EP-05 — /api/v1/vehicles/:id/reminders</text>

    <rect x="575" y="14" width="82" height="20" rx="4" class="badge-auth-yes" />
    <text x="616" y="28" text-anchor="middle" class="badge-auth-yes-txt">🔒 JWT Bearer</text>

    <line x1="14" y1="44" x2="656" y2="44" stroke="#F1F5F9" stroke-width="1" />

    <!-- Description -->
    <text x="16" y="62" class="desc-text">Returns active component reminder rules, remaining km/days, and Khmer slang names.</text>

    <!-- Request / Response Box -->
    <rect x="14" y="74" width="642" height="72" rx="6" fill="#F8FAFC" stroke="#F1F5F9" />
    <text x="24" y="92" class="detail-label">Payload:</text>
    <text x="80" y="92" class="detail-code">None (Vehicle ID in path parameter)</text>

    <text x="24" y="112" class="detail-label">Response:</text>
    <text x="80" y="112" class="detail-code">200 OK -> data: [ { component: { name_km: 'ប្រេងម៉ាស៊ីន' }, status, remaining_km } ]</text>

    <text x="24" y="132" class="detail-label">Assertion:</text>
    <text x="80" y="132" font-size="10" fill="#059669">status == 200 && data[0].component.name_km exists && ['upcoming','due_soon','overdue'].includes(status)</text>
  </g>

  <g transform="translate(740, 315)" filter="url(#cardShadow)">
    <rect width="670" height="160" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    
    <!-- Top Row -->
    <rect x="14" y="14" width="48" height="22" rx="4" class="badge-post" />
    <text x="38" y="29" text-anchor="middle" class="badge-post-txt">POST</text>

    <text x="70" y="29" class="endpoint-title">EP-06 — /api/v1/vehicles/:id/services</text>

    <rect x="575" y="14" width="82" height="20" rx="4" class="badge-auth-yes" />
    <text x="616" y="28" text-anchor="middle" class="badge-auth-yes-txt">🔒 JWT Bearer</text>

    <line x1="14" y1="44" x2="656" y2="44" stroke="#F1F5F9" stroke-width="1" />

    <!-- Description -->
    <text x="16" y="62" class="desc-text">Logs 1-tap completed maintenance, records service_logs, and resets baseline counters.</text>

    <!-- Request / Response Box -->
    <rect x="14" y="74" width="642" height="72" rx="6" fill="#F8FAFC" stroke="#F1F5F9" />
    <text x="24" y="92" class="detail-label">Payload:</text>
    <text x="80" y="92" class="detail-code">{"garage_id": UUID, "odometer_km": 13500, "total_cost_cents": 500, "items": [...] }</text>

    <text x="24" y="112" class="detail-label">Response:</text>
    <text x="80" y="112" class="detail-code">201 Created -> data: { service_log_id, reset_reminders: [ { new_status: 'upcoming' } ] }</text>

    <text x="24" y="132" class="detail-label">Assertion:</text>
    <text x="80" y="132" font-size="10" fill="#059669">status == 201 && reset_reminders[0].new_status == 'upcoming'</text>
  </g>

  <g transform="translate(740, 490)" filter="url(#cardShadow)">
    <rect width="670" height="160" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    
    <!-- Top Row -->
    <rect x="14" y="14" width="48" height="22" rx="4" class="badge-get" />
    <text x="38" y="29" text-anchor="middle" class="badge-get-txt">GET</text>

    <text x="70" y="29" class="endpoint-title">EP-07 — /api/v1/vehicles/:id/services</text>

    <rect x="575" y="14" width="82" height="20" rx="4" class="badge-auth-yes" />
    <text x="616" y="28" text-anchor="middle" class="badge-auth-yes-txt">🔒 JWT Bearer</text>

    <line x1="14" y1="44" x2="656" y2="44" stroke="#F1F5F9" stroke-width="1" />

    <!-- Description -->
    <text x="16" y="62" class="desc-text">Retrieves paginated historical service logs with line items, parts cost, and garage name.</text>

    <!-- Request / Response Box -->
    <rect x="14" y="74" width="642" height="72" rx="6" fill="#F8FAFC" stroke="#F1F5F9" />
    <text x="24" y="92" class="detail-label">Payload:</text>
    <text x="80" y="92" class="detail-code">None (Query: ?page=1&limit=20)</text>

    <text x="24" y="112" class="detail-label">Response:</text>
    <text x="80" y="112" class="detail-code">200 OK -> data: [ { id, service_date, total_cost_cents: 500, items: [...] } ]</text>

    <text x="24" y="132" class="detail-label">Assertion:</text>
    <text x="80" y="132" font-size="10" fill="#059669">status == 200 && Number.isInteger(data[0].total_cost_cents)</text>
  </g>

  <g transform="translate(740, 665)" filter="url(#cardShadow)">
    <rect width="670" height="160" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    
    <!-- Top Row -->
    <rect x="14" y="14" width="48" height="22" rx="4" class="badge-post" />
    <text x="38" y="29" text-anchor="middle" class="badge-post-txt">POST</text>

    <text x="70" y="29" class="endpoint-title">EP-08 — /api/v1/garages</text>

    <rect x="575" y="14" width="82" height="20" rx="4" class="badge-auth-yes" />
    <text x="616" y="28" text-anchor="middle" class="badge-auth-yes-txt">🔒 JWT Bearer</text>

    <line x1="14" y1="44" x2="656" y2="44" stroke="#F1F5F9" stroke-width="1" />

    <!-- Description -->
    <text x="16" y="62" class="desc-text">Pins a trusted roadside mechanic stall (ឈ្មោះជាង, លេខទូរស័ព្ទ, GPS coordinates).</text>

    <!-- Request / Response Box -->
    <rect x="14" y="74" width="642" height="72" rx="6" fill="#F8FAFC" stroke="#F1F5F9" />
    <text x="24" y="92" class="detail-label">Payload:</text>
    <text x="80" y="92" class="detail-code">{"name": "ជាង រិទ្ធ ជួសជុលម៉ូតូ", "phone": "+85512888999", "latitude": 11.568, "longitude": 104.89 }</text>

    <text x="24" y="112" class="detail-label">Response:</text>
    <text x="80" y="112" class="detail-code">201 Created -> data: { id: UUID, name: "ជាង រិទ្ធ...", is_verified: false }</text>

    <text x="24" y="132" class="detail-label">Assertion:</text>
    <text x="80" y="132" font-size="10" fill="#059669">status == 201 && data.name.includes('រិទ្ធ')</text>
  </g>

  <g transform="translate(40, 845)">
    <rect width="1370" height="65" rx="8" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#cardShadow)" />
    <text x="20" y="26" font-size="12" font-weight="700" fill="#0F172A">AUTOMATED API TEST COLLECTION VERIFICATION</text>
    <text x="20" y="46" font-size="11" fill="#475569">Collection File: <tspan font-family="'Consolas', monospace" font-weight="700" fill="#2563EB">api-specs/motocare_api_collection.json</tspan> | 8 Endpoints covered with status &amp; JSON schema assertions.</text>
    
    <rect x="1170" y="16" width="180" height="32" rx="6" fill="#ECFDF5" stroke="#10B981" />
    <text x="1260" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">✓ 8 / 8 Contracts Specified</text>
  </g>
</svg>